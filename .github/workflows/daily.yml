name: Daily News

on:
  schedule:
    # Morning run — 09:07 America/New_York
    # EDT = 13:07 UTC
    # EST = 14:07 UTC
    - cron: '7 13 * * *'
    - cron: '7 14 * * *'

    # Close run — 16:37 America/New_York
    # EDT = 20:37 UTC
    # EST = 21:37 UTC
    - cron: '37 20 * * *'
    - cron: '37 21 * * *'

  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Run mode: morning or close'
        required: false
        default: 'morning'


permissions:
  contents: write

jobs:
  build-daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show current time
        run: |
          echo "UTC time:"
          date -u
          echo "New York time:"
          TZ=America/New_York date

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install openai feedparser python-dateutil requests
          fi

      - name: Ensure docs directories exist
        run: |
          mkdir -p docs
          mkdir -p docs/history

      - name: Determine run mode
        id: runmode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.run_mode }}"
            NOTIFY_WECHAT="true"
          else
            HOUR=$(TZ=America/New_York date +%H)
            MIN=$(TZ=America/New_York date +%M)

            if [ "$MIN" = "37" ]; then
              MODE="close"
            else
              MODE="morning"
            fi

            if [ "$HOUR" = "09" ] && [ "$MIN" = "07" ]; then
              NOTIFY_WECHAT="true"
            else
              NOTIFY_WECHAT="false"
            fi
          fi

          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "notify_wechat=$NOTIFY_WECHAT" >> $GITHUB_OUTPUT
          echo "Resolved run mode: $MODE"
          echo "Push morning news to WeChat: $NOTIFY_WECHAT"

      - name: Generate daily files
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          TZ: America/New_York
          RUN_MODE: ${{ steps.runmode.outputs.mode }}
        run: |
          python scripts/generate_daily.py

      - name: Verify generated files
        run: |
          echo "Generated files:"
          ls -lah docs || true
          test -f docs/index.html
          test -f docs/reading.html
          test -f docs/reading.json
          test ! -f docs/monitor.json
          python scripts/verify_history_retention.py
          SERVERCHAN_SENDKEY=SCT_DRY_RUN python scripts/push_wechat.py --dry-run

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update daily dashboard (${{ steps.runmode.outputs.mode }})"
            git push
          fi

      - name: Push daily news to WeChat
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          SHOULD_NOTIFY: ${{ steps.runmode.outputs.notify_wechat }}
          RUN_MODE: ${{ steps.runmode.outputs.mode }}
          TZ: America/New_York
        run: |
          if [ "$SHOULD_NOTIFY" != "true" ]; then
            echo "Skipping WeChat push for this run."
            exit 0
          fi

          if [ -z "$SERVERCHAN_SENDKEY" ]; then
            echo "SERVERCHAN_SENDKEY is not configured."
            exit 1
          fi

          python scripts/push_wechat.py
